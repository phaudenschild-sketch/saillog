[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "saillog"
version = "0.1.3"
description = "Segel-Logbuch mit NMEA2000/NMEA0183-Anbindung über WLAN/LAN-Gateway."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
# Keine externen Abhängigkeiten — nur die Python-Standardbibliothek
# (socket, sqlite3, tkinter, csv). Auf Windows 11 genügt eine
# Standard-Python-Installation.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
# Nur für die automatische Kartenplotter-Bildschirmaufnahme
screenshot = [
    "pillow>=9.0",
]
# Nur für den seriellen Anschluss (z.B. Maretron USB100 am COM-Port)
serial = [
    "pyserial>=3.5",
]
# Nur zum Erstellen der Windows-EXE (siehe docs/BUILD.md, saillog.spec)
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
saillog = "saillog.app:main"
saillog-sim = "saillog.simulator:main"
saillog-discover = "saillog.discover:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
